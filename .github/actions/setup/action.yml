name: 'Set up a nimony build environment'
description: >
  Everything both CI jobs need before they can build or test: the two checkouts,
  the platform toolchain, Nim, and the host-Nim artifact cache. Factored out of
  ci.yml because the `tests` and `boot` jobs run this identical preamble and
  then diverge in one step.

inputs:
  cpu:
    description: 'Target CPU: amd64 | i386 | arm64'
    required: true
  nim_branch:
    description: 'Nim branch setup-nim installs and whose compiler sources are overlaid'
    required: true

runs:
  using: composite
  steps:
    - name: set `core.autocrlf` to false
      shell: bash
      run: |
        git config --global core.autocrlf false
        git config --global init.defaultBranch master

    - name: Disable Defender real-time scan for workspace (Windows)
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        # Defender scanning every file the Nim/MinGW toolchain touches is the
        # single biggest reason Windows CI runs ~3x slower than Linux/macOS
        # for this workload. Excluding the workspace and the compiler
        # processes brings I/O-bound build/test phases close to parity.
        $ErrorActionPreference = 'Continue'
        Add-MpPreference -ExclusionPath "${{ github.workspace }}" -ErrorAction SilentlyContinue
        Add-MpPreference -ExclusionPath "$env:USERPROFILE\nimcache" -ErrorAction SilentlyContinue
        Add-MpPreference -ExclusionPath "$env:TEMP" -ErrorAction SilentlyContinue
        foreach ($p in @('nim.exe','nimony.exe','nimsem.exe','hexer.exe','lengc.exe','nifler.exe','nifmake.exe','nj.exe','vl.exe','validator.exe','dagon.exe','controlflow.exe','contracts.exe','hastur.exe','tester.exe','gcc.exe','g++.exe','ld.exe','as.exe','ar.exe','make.exe')) {
          Add-MpPreference -ExclusionProcess $p -ErrorAction SilentlyContinue
        }

    - name: Checkout nimony
      # Check out into `nimony/` (NOT `nif/`): the native backend's arkham/nifasm
      # `nim.cfg` reuse nimony's NIF libraries via `../../../nimony/src/lib`, so the
      # repo's working-tree directory MUST be named `nimony` for that sibling-relative
      # path to resolve — the same layout developer machines use.
      uses: actions/checkout@v7
      with:
        path: nimony
        submodules: false

    - name: Checkout nativenif (sibling of nimony)
      # Which COMMIT is decided by `nimony/src/nativenif.commit`, not here: hastur
      # checks the pin out before it builds arkham/nifasm from this tree. Hence
      # `fetch-depth: 0` — the default shallow clone stops at the tip of the
      # default branch, so a pin that is one commit behind (or on another
      # branch) would not be in the object store and hastur would have to fetch
      # it back. The repo is small; a full clone is cheaper than that round trip.
      uses: actions/checkout@v7
      with:
        repository: nim-lang/nativenif
        path: nativenif
        fetch-depth: 0
        submodules: false

    - name: Install Linux dependency (Linux)
      if: runner.os == 'Linux' && inputs.cpu == 'amd64'
      shell: bash
      run: |
        # gcc-14/g++-14 ship preinstalled on the ubuntu-24.04 image, so only
        # valgrind actually needs fetching. Installing the compilers anyway
        # made this step ~5 minutes (apt pulled and reinstalled the full
        # toolchain); with just valgrind it is a few seconds.
        # `--no-install-recommends` keeps valgrind from dragging in its
        # (unused here) debuginfo/doc recommends.
        sudo apt-get update -qq
        sudo DEBIAN_FRONTEND=noninteractive apt-get install \
          --no-install-recommends -yq valgrind
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 60 --slave /usr/bin/g++ g++ /usr/bin/g++-14

    - name: Install dependencies (Linux i386)
      if: runner.os == 'Linux' && inputs.cpu == 'i386'
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update -qq
        sudo DEBIAN_FRONTEND='noninteractive' apt-get install \
          --no-install-recommends -yq gcc-multilib g++-multilib \
          libssl-dev:i386

        mkdir -p external/bin
        cat << EOF > external/bin/gcc
        #!/bin/bash

        exec $(which gcc) -m32 "\$@"
        EOF

        cat << EOF > external/bin/g++
        #!/bin/bash

        exec $(which g++) -m32 "\$@"
        EOF

        chmod 755 external/bin/gcc external/bin/g++

        echo "$PWD/external/bin" >> "${GITHUB_PATH}"

    - name: Restore MinGW-W64 (Windows) from cache
      if: runner.os == 'Windows'
      id: windows-mingw-cache
      uses: actions/cache@v5
      with:
        path: external/mingw-${{ inputs.cpu }}
        # Bump the suffix when changing MINGW_URL below — the old cache
        # would otherwise keep delivering the previous bundle even though
        # the archive name and contents changed.
        key: 'mingw-${{ inputs.cpu }}-gcc14-llvm19'

    - name: Restore Nim DLLs dependencies (Windows) from cache
      if: runner.os == 'Windows'
      id: windows-dlls-cache
      uses: actions/cache@v5
      with:
        path: external/dlls-${{ inputs.cpu }}
        key: 'dlls-${{ inputs.cpu }}'

    - name: Install MinGW64 dependency (Windows)
      if: >
        steps.windows-mingw-cache.outputs.cache-hit != 'true' &&
        runner.os == 'Windows'
      shell: bash
      run: |
        mkdir -p external
        # winlibs gcc 14.2.0 + LLVM 19.1.7 bundled. We pull the GCC+LLVM
        # variant (rather than gcc-only) so `clang` and `ld.lld` ship
        # alongside `gcc`. The LLD that lands here lays out PE `.tls$`
        # the way the Windows loader expects — needed for clang's native
        # TLS code-gen to actually run; ld.bfd in older bundles got this
        # wrong and produced binaries that segfaulted on first TLS access.
        # Sticking with msvcrt (matches the older bundle's runtime) so
        # we don't churn the runtime ABI in this same change.
        if [[ '${{ inputs.cpu }}' == 'amd64' ]]; then
          MINGW_URL="https://github.com/brechtsanders/winlibs_mingw/releases/download/14.2.0posix-19.1.7-12.0.0-msvcrt-r3/winlibs-x86_64-posix-seh-gcc-14.2.0-llvm-19.1.7-mingw-w64msvcrt-12.0.0-r3.7z"
          ARCH=64
        else
          MINGW_URL="https://github.com/brechtsanders/winlibs_mingw/releases/download/14.2.0posix-19.1.7-12.0.0-msvcrt-r3/winlibs-i686-posix-dwarf-gcc-14.2.0-llvm-19.1.7-mingw-w64msvcrt-12.0.0-r3.7z"
          ARCH=32
        fi
        curl -L "$MINGW_URL" -o "external/mingw-${{ inputs.cpu }}.7z"
        7z x -y "external/mingw-${{ inputs.cpu }}.7z" -oexternal/
        mv external/mingw$ARCH external/mingw-${{ inputs.cpu }}

    - name: Install DLLs dependencies (Windows)
      if: >
        steps.windows-dlls-cache.outputs.cache-hit != 'true' &&
        runner.os == 'Windows'
      shell: bash
      run: |
        mkdir -p external
        curl -L "https://nim-lang.org/download/windeps.zip" -o external/windeps.zip
        7z x -y external/windeps.zip -oexternal/dlls-${{ inputs.cpu }}

    - name: Path to cached dependencies (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        echo '${{ github.workspace }}'"/external/mingw-${{ inputs.cpu }}/bin" >> $GITHUB_PATH
        echo '${{ github.workspace }}'"/external/dlls-${{ inputs.cpu }}" >> $GITHUB_PATH

    - name: Install make dependencies with chocolatey (Windows)
      if: runner.os == 'Windows'
      uses: crazy-max/ghaction-chocolatey@v4
      with:
        args: install make

    - name: System Info (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: "gcc -v"

    # `setup-nim` resolves exactly one tag — the rolling `latest-<branch>` alias
    # in nim-lang/nightlies — and fails outright when it is absent. On
    # 2026-08-27 it was absent for `devel`: that day's nightlies run BUILT devel
    # fine (its dated release carries all nine assets), but the "Push
    # latest-devel tag" job failed, and that job deletes the alias before it
    # recreates it:
    #
    #     gh release delete -y "$tag" || :
    #     git push --delete origin "$tag" || :
    #     gh release create ... "$tag" ...
    #
    # so a failure after the deletes leaves no alias at all, and every consumer
    # stops at "Could not find any release named 'latest-devel'". The dated
    # releases are what the alias points AT, so the newest one for the branch is
    # the same compiler reached by a different name.
    #
    # This step only decides WHICH of the two following steps runs. When the
    # alias is there — the normal case — nothing changes: the action installs it
    # exactly as before.
    - name: Resolve the Nim nightly
      id: nim
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -uo pipefail
        branch='${{ inputs.nim_branch }}'
        # Byte-for-byte the probe `setup-nim`'s own `setup.sh` makes, so this
        # can never disagree with what the action would then do.
        if curl -fsI "https://github.com/nim-lang/nightlies/releases/latest-$branch" >/dev/null 2>&1; then
          echo "alias=true" >> "$GITHUB_OUTPUT"
          echo "latest-$branch is present; installing it with setup-nim."
          exit 0
        fi
        echo "alias=false" >> "$GITHUB_OUTPUT"
        echo "::warning::latest-$branch is missing from nim-lang/nightlies (upstream alias job); falling back to the newest dated nightly"

        # The archive names `setup-nim` derives, and the same mapping: a dated
        # release spells its assets `nim-<version>-<os>_<arch>.<ext>` while the
        # alias renames them to `<os>_<arch>.<ext>`, so match on the suffix and
        # let the version float.
        case '${{ runner.os }}' in
          Linux)   os=linux ;;
          macOS)   os=macosx ;;
          Windows) os=windows ;;
          *) echo "::error::setup: unknown runner OS '${{ runner.os }}'"; exit 1 ;;
        esac
        case '${{ inputs.cpu }}' in
          amd64) arch=x64 ;;
          i386)  arch=x32 ;;
          arm64) arch=arm64 ;;
          *) echo "::error::setup: unknown cpu '${{ inputs.cpu }}'"; exit 1 ;;
        esac
        # `if`, not `[ … ] && …`: the runner's shell is `bash -e`, and a
        # trailing AND-list whose test is false is a failed command — the step
        # would have exited 1 on every host that is not Windows.
        if [ "$os" = windows ]; then ext=.zip; else ext=.tar.xz; fi
        suffix="-${os}_${arch}${ext}"

        # Newest first is the API's own order, so `first` after the date-prefix
        # filter is the newest dated build of this branch. The filter anchors on
        # the date so it cannot match `latest-version-2-4` and friends.
        # Authenticated when there is a token (there always is in Actions, and
        # the unauthenticated API rate limit is per runner IP — i.e. shared).
        auth=()
        if [ -n "${GH_TOKEN:-}" ]; then auth=(-H "Authorization: Bearer $GH_TOKEN"); fi
        url=$(curl -fsSL "${auth[@]}" \
                "https://api.github.com/repos/nim-lang/nightlies/releases?per_page=100" |
              jq -r --arg br "$branch" --arg sfx "$suffix" '
                [ .[] | select(.tag_name | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}-" + $br + "-")) ]
                | first
                | .assets[] | select(.name | endswith($sfx)) | .browser_download_url')
        if [ -z "$url" ] || [ "$url" = null ]; then
          echo "::error::setup: no dated nightly for branch '$branch' carries a '*$suffix' asset"
          exit 1
        fi
        echo "url=$url" >> "$GITHUB_OUTPUT"
        echo "Falling back to $url"

    - name: Setup Nim
      if: steps.nim.outputs.alias == 'true'
      uses: alaviss/setup-nim@0.1.1
      with:
        path: 'nim'
        version: ${{ inputs.nim_branch }}
        architecture: ${{ inputs.cpu }}

    - name: Setup Nim from a dated nightly
      # The fallback path. Does what `setup-nim` does — unpack the archive into
      # `nim/` stripping its one top-level directory, then put `nim/bin` and
      # nimble's bin on PATH — for the one tag it cannot ask for. The action's
      # third step, its problem matcher, is inside the action and stays behind;
      # it only annotates compiler diagnostics in the run log.
      if: steps.nim.outputs.alias != 'true'
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p nim
        cd nim
        url='${{ steps.nim.outputs.url }}'
        archive=${url##*/}
        curl -fsSL -o "$archive" "$url"
        if [[ $archive == *.zip ]]; then
          tmp=$(mktemp -d)
          7z x "$archive" "-o$tmp" > /dev/null
          extracted=( "$tmp"/* )
          mv "${extracted[0]}"/* .
          rm -rf "$tmp"
        else
          tar -xf "$archive" --strip-components 1
        fi
        rm -f "$archive"
        nimbin=$(cd bin && pwd -P)
        nimblebin="$HOME/.nimble/bin"
        if [ '${{ runner.os }}' = Windows ]; then
          nimbin=$(cygpath -aw "$nimbin")
          nimblebin=$(cygpath -aw "$nimblebin")
        fi
        echo "$nimbin" >> "$GITHUB_PATH"
        echo "$nimblebin" >> "$GITHUB_PATH"
        # `sed -n 1p`, not `head -1`: head closes the pipe on line two and the
        # shell runs with `pipefail`, so the SIGPIPE would fail this step over a
        # log line.
        "$PWD/bin/nim" --version | sed -n 1p

    - name: Overlay current Nim compiler source (devel parser fixes)
      shell: bash
      run: |
        # setup-nim installs a *prebuilt nightly binary* from nim-lang/nightlies,
        # not the live `devel` tree. That nightly can lag real `devel` by weeks
        # (it has been frozen since 2026-05-06). Nifler compiles Nim's own
        # `compiler/parser.nim` (resolved through `--path:$nim`, see
        # src/nifler/nim.cfg), so a stale nightly cannot parse newer syntax such
        # as `type C = concept of D`. The nightly's `bin/nim` is fine as the
        # bootstrap compiler; we only need fresh *compiler sources* overlaid on
        # top so parser fixes land when Nifler is (re)built.
        #
        # `lib/packages/docutils` comes along because the compiler's docgen is
        # its consumer and upstream changes the two in one commit: nim-lang/Nim
        # #26139 (2026-09-03) widened `rstgen.mergeIndexes` together with the
        # call in `docgen.nim`, and the overlaid compiler stopped type-checking
        # against the nightly's older lib. It is the only part of `lib/` outside
        # `std/` that `compiler/` imports.
        git clone --depth 1 --branch ${{ inputs.nim_branch }} \
          https://github.com/nim-lang/Nim nim-src
        cp -a nim-src/compiler/. nim/compiler/
        cp -a nim-src/lib/packages/docutils/. nim/lib/packages/docutils/

    - name: Cache host-Nim build artifacts
      uses: actions/cache@v5
      with:
        # `nimony/bin/` holds the built tools. The two `nim` paths are Nim's
        # default per-project cache locations: `~/.cache/nim/<name>_d/` on
        # POSIX and `~/nimcache/<name>_d/` on Windows (see compiler/options.nim
        # `getOsCacheDir`). Caching both lets `hastur build all` short-circuit
        # to a near-no-op when source hasn't changed; on partial hits the
        # incremental rebuild still benefits from the prior cache.
        #
        # The `tests` and `boot` jobs share this key on purpose — they build the
        # same toolchain from the same sources. Whichever finishes first saves
        # it; the other's save is refused with a warning ("another job may be
        # creating this cache"), which is harmless.
        path: |
          nimony/bin
          ~/.cache/nim
          ~/nimcache
        # `src/nativenif.commit` is in the key for the same reason the sources
        # are: `bin/` holds arkham and nifasm, and which nativenif commit they
        # were built from is an input to them. Without it a re-pin would restore
        # the previous commit's pair.
        key: hastur-release-${{ runner.os }}-${{ inputs.cpu }}-${{ inputs.nim_branch }}-${{ hashFiles('nimony/src/**/*.nim', 'nimony/src/**/*.cfg', 'nimony/src/**/*.nims', 'nimony/src/nativenif.commit') }}
        restore-keys: |
          hastur-release-${{ runner.os }}-${{ inputs.cpu }}-${{ inputs.nim_branch }}-

    - name: Create dist/nimony symlink for Nim compiler
      shell: bash
      run: |
        rm -rf nim/dist/nimony
        mkdir -p nim/dist
        ln -sf "${{ github.workspace }}/nimony" nim/dist/nimony
