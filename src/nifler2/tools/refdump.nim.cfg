# `refdump` links Nim 2's lexer, so it needs the compiler's own module
# directory on the search path -- the same trick `src/nifler/nim.cfg` plays.
# Kept as a per-project config rather than a `nim.cfg` so that `gramcheck`,
# which sits in this directory too, keeps building with the plain defaults.
--path: "$nim"
--path: "$nim/compiler"
--define: nimcore
