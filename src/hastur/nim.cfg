# Btw this relies on a Nim bug where it interprets the --outdir relative to the
# current directory instead of the directory of this nim.cfg file. Every hastur
# command runs from the project root, so `nim c src/hastur/hastur.nim` produces
# `bin/hastur` — the same place `hastur build` puts every other tool.
--outdir: "bin"
# `src/config.nims` promotes these warnings to errors, but Nim 2.2.10's host
# stdlib trips them on patterns we cannot act on: `typedthreads` (createThread,
# used by the parallel runner) and `deques`. Same overrides `nimcPrefix` passes
# when hastur builds the other tools.
--warningAsError:ProveInit:off
--warningAsError:Uninit:off
